[package]
name = "codexline"
version = "2.1.0"
edition = "2024"
rust-version = "1.88"
default-run = "codexline"
description = "codexline - High-performance Codex CLI StatusLine tool written in Rust"
authors = ["Haleclipse"]
license = "MIT"
repository = "https://github.com/IpiggyI/CCometixLine"
readme = "README.md"
keywords = ["codex", "statusline", "powerline", "rust", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "ccometixline"
path = "src/lib.rs"

[[bin]]
name = "codexline"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
clap = { version = "4.5", features = ["derive"] }
toml = "1.0"
chrono = "0.4"
dirs = "6.0"
regex = "1.0"
unicode-width = "0.2"
unicode-segmentation = "1.12"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }

[dev-dependencies]
insta = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
