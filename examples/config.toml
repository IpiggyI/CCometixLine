# CCometixLine — full configuration sample (V1 + V2 + V3 + V3.1)
#
# Copy this file to ~/.claude/ccline/config.toml to enable every Path D
# feature added in v1.2.x:
#   * V1   — `since_reply` + `session_tokens` segments, `cache_hit.mode`
#   * V2   — threshold colorization (warning / critical fields)
#   * V3   — multi-line `[layout]` with `merge_groups`
#   * V3.1 — row-balance (auto-fuse short rows into the narrower neighbor)
#
# Setting `[layout].mode = "compact"` (or omitting the entire `[layout]`
# block) reproduces the v1.1.2 single-line behavior byte-for-byte.

theme = "gruvbox"

[style]
mode = "nerd_font"
separator = " | "

# ===== V3 multi-line layout + V3.1 row-balance =====
[layout]
mode = "expanded"
auto_stack_on_overflow = true
balance = true
min_row_width = 20
# target_row_width omitted -> auto = 0.7 * terminal width

[[layout.merge_groups]]
ids = ["model", "directory", "git"]

[[layout.merge_groups]]
ids = ["context_window", "cache_hit"]

[[layout.merge_groups]]
ids = ["since_reply", "session_tokens"]

# ===== Segments =====

[[segments]]
id = "model"
enabled = true

[segments.icon]
plain = "🤖"
nerd_font = ""

[segments.colors.icon]
c256 = 208

[segments.colors.text]
c256 = 208

[segments.styles]
text_bold = true

[segments.options]

[[segments]]
id = "directory"
enabled = true

[segments.icon]
plain = "📁"
nerd_font = "󰉋"

[segments.colors.icon]
c256 = 142

[segments.colors.text]
c256 = 142

[segments.styles]
text_bold = true

[segments.options]

[[segments]]
id = "git"
enabled = true

[segments.icon]
plain = "🌿"
nerd_font = "󰊢"

[segments.colors.icon]
c256 = 109

[segments.colors.text]
c256 = 109

# V2 — color shifts when local branch is pushable but unpushed
[segments.colors.warning]
c256 = 214

[segments.colors.critical]
c256 = 167

[segments.styles]
text_bold = true

[segments.options]
show_sha = false
push_warning_threshold = 5
push_critical_threshold = 20

[[segments]]
id = "context_window"
enabled = true

[segments.icon]
plain = "⚡️"
nerd_font = ""

[segments.colors.icon]
c256 = 142

[segments.colors.text]
c256 = 142

# V2 — claude-hud parity: warn at 70%, critical at 85%
[segments.colors.warning]
c256 = 214

[segments.colors.critical]
c256 = 167

[segments.styles]
text_bold = true

[segments.options]
warning_threshold = 70.0
critical_threshold = 85.0

[[segments]]
id = "usage"
enabled = false

[segments.icon]
plain = "📊"
nerd_font = "󰪞"

[segments.colors.icon]
c16 = 14

[segments.colors.text]
c16 = 14

[segments.styles]
text_bold = false

[segments.options]
cache_duration = 180
api_base_url = "https://api.anthropic.com"
timeout = 2

[[segments]]
id = "cost"
enabled = true

[segments.icon]
plain = "💰"
nerd_font = ""

[segments.colors.icon]
c256 = 214

[segments.colors.text]
c256 = 214

[segments.styles]
text_bold = true

[segments.options]

[[segments]]
id = "session"
enabled = true

[segments.icon]
plain = "⏱️"
nerd_font = "󱦻"

[segments.colors.icon]
c256 = 142

[segments.colors.text]
c256 = 142

[segments.styles]
text_bold = true

[segments.options]

[[segments]]
id = "output_style"
enabled = false

[segments.icon]
plain = "🎯"
nerd_font = "󱋵"

[segments.colors.icon]
c256 = 109

[segments.colors.text]
c256 = 109

[segments.styles]
text_bold = true

[segments.options]

[[segments]]
id = "cache_hit"
enabled = true

[segments.icon]
plain = "⚡"
nerd_font = ""

[segments.colors.icon]
c256 = 142

[segments.colors.text]
c256 = 142

# V2 — REVERSE thresholds: low hit-rate = bad
[segments.colors.warning]
c256 = 214

[segments.colors.critical]
c256 = 167

[segments.styles]
text_bold = true

[segments.options]
# V1 — primary display: "last" (v1.1.2 default) | "total" | "both" (XX%/YY%)
mode = "both"
warning_below = 60.0
critical_below = 30.0

# ===== V1 new segments =====

[[segments]]
id = "since_reply"
enabled = true

[segments.icon]
plain = "⏳"
nerd_font = ""

[segments.colors.icon]
c256 = 142

[segments.colors.text]
c256 = 142

[segments.colors.warning]
c256 = 214

[segments.colors.critical]
c256 = 167

[segments.styles]
text_bold = false

[segments.options]
warning_seconds = 300
critical_seconds = 1800

[[segments]]
id = "session_tokens"
enabled = true

[segments.icon]
plain = "Σ"
nerd_font = ""

[segments.colors.icon]
c256 = 175

[segments.colors.text]
c256 = 175

[segments.styles]
text_bold = false

[segments.options]
